x-runtime-environment: &runtime-environment
  NODE_ENV: ${NODE_ENV:-production}
  APP_NAME: ${APP_NAME:-lingcoo-system-base-framework}
  APP_VERSION: ${APP_VERSION:-development}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8090}
  CORS_ORIGIN: ${CORS_ORIGIN:-https://test.lingcoo.com}
  DATABASE_URL: ${DATABASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${LINGCOO_BASE_RUNTIME_IMAGE:-ghcr.io/lingcootech/lingcoo-system-base-framework:latest}
    restart: unless-stopped
    init: true
    environment: *runtime-environment
    command: ['node', 'dist/server.js']
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8090'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - '${LINGCOO_BASE_HTTP_PORT:-18093}:80'
      - '${LINGCOO_BASE_HTTPS_PORT:-18449}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
