name: Release Frame Packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm dist-tag to publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: frame_release
          POSTGRES_USER: frame_release
          POSTGRES_PASSWORD: frame_release
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U frame_release -d frame_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://frame_release:frame_release@localhost:5437/frame_release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: ${{ inputs.channel == 'stable' && 'https://registry.npmjs.org' || 'https://npm.pkg.github.com' }}
          scope: '@lingcootech'
      - name: Use npm with trusted publishing support
        if: ${{ inputs.channel == 'stable' }}
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run build:packages
      - run: npm run db:migrate
      - name: Verify migration idempotency
        run: npm run db:migrate
      - run: npm run packages:verify
        env:
          VERIFY_GENERATED_DOCKER: '1'
      - run: node scripts/publish-packages.mjs "${{ inputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ inputs.channel == 'stable' && secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
