name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingcoo_base
          POSTGRES_USER: lingcoo_base
          POSTGRES_PASSWORD: lingcoo_base
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U lingcoo_base -d lingcoo_base"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lingcoo_base:lingcoo_base@localhost:5437/lingcoo_base

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:packages
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run packages:verify
      - run: npm audit --omit=dev --audit-level=high
