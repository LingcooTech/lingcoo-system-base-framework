name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingcoo_base
          POSTGRES_USER: lingcoo_base
          POSTGRES_PASSWORD: lingcoo_base
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U lingcoo_base -d lingcoo_base"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lingcoo_base:lingcoo_base@localhost:5437/lingcoo_base

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:packages
      - run: npm run db:migrate
      - name: Verify migration idempotency
        run: npm run db:migrate
      - run: npm run check
      - run: npm run packages:verify
        env:
          VERIFY_GENERATED_DOCKER: '1'
      - run: npm audit --omit=dev --audit-level=high
