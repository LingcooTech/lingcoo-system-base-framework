name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json
            public-web/package-lock.json
      - run: npm ci
      - run: npm --prefix admin-ui ci
      - run: npm --prefix public-web ci
      - run: npm run check
      - run: npm run build:all
